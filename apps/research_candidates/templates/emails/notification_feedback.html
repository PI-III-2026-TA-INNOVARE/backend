<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .header {
            background-color: #9C27B0;
            color: white;
            padding: 20px;
            border-radius: 5px 5px 0 0;
            text-align: center;
        }
        .content {
            padding: 20px;
        }
        .footer {
            background-color: #f5f5f5;
            padding: 10px;
            font-size: 12px;
            color: #777;
            border-radius: 0 0 5px 5px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #9C27B0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>💬 Feedback Recebido</h2>
        </div>
        <div class="content">
            <p>Olá {{ user.first_name }},</p>
            <p>{{ message }}</p>

            <p>Acesse a plataforma para ver os detalhes.</p>

            <a href="{{ frontend_url }}/research/my-interests/" class="button">
                Ver Feedback
            </a>
        </div>
        <div class="footer">
            <p>Esta é uma notificação automática de P&D Connect. Não responda este email.</p>
            <p>&copy; 2026 P&D Connect. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
